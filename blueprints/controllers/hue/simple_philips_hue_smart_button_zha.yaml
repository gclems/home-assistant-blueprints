blueprint:
  name: Simple Philips Hue Smart Button — ZHA
  description: >
    Controls an area using a Philips Hue Smart Button connected directly to ZHA.

    Short press toggles the synchronized lighting of the selected area.

    The actual lighting behavior is delegated to
    script.toggle_eclairage_synchronise.
  domain: automation
  source_url: https://github.com/gclems/home-assistant-blueprints

  input:
    controller:
      name: Hue Smart Button
      description: Select the Philips Hue Smart Button connected through ZHA.
      selector:
        device:
          filter:
            - integration: zha
              manufacturer: Signify Netherlands B.V.

    area:
      name: Area
      description: Area controlled by this Smart Button.
      selector:
        area:

variables:
  controller_device: !input controller
  target_area: !input area

mode: single

triggers:
  - trigger: event
    event_type: zha_event

conditions:
  - condition: template
    value_template: >-
      {% set e = trigger.event.data %}
      {{ e.device_id == controller_device
         and e.endpoint_id == 1
         and e.cluster_id == 64512
         and e.command == 'on_press' }}

actions:
  - action: script.toggle_eclairage_synchronise
    data:
      area: "{{ target_area }}"
