blueprint:
  name: Simple Philips Hue Dimmer Switch — ZHA
  description: >
    Controls an area using a Philips Hue Dimmer Switch connected directly to ZHA.

    Buttons:

    - Power short press: toggle synchronized lighting for the area
    - Power hold: no action
    - Brightness + short press: +5%
    - Brightness + hold: +10%
    - Brightness - short press: -5%
    - Brightness - hold: -10%
    - Hue/Off short press: toggle Natural Light for the area
    - Hue/Off hold: turn off all lights in the area

    The automation only provides the Dimmer Switch and the area.
    All button behavior is defined by this blueprint.
  domain: automation
  source_url: https://github.com/gclems/home-assistant-blueprints

  input:
    controller:
      name: Hue Dimmer Switch
      description: Select the Philips Hue Dimmer Switch connected through ZHA.
      selector:
        device:
          filter:
            - integration: zha
              manufacturer: Signify Netherlands B.V.

    area:
      name: Area
      description: Area controlled by this Dimmer Switch.
      selector:
        area:

variables:
  controller_device: !input controller
  target_area: !input area

mode: parallel
max: 20

triggers:
  - trigger: event
    event_type: zha_event

conditions:
  - condition: template
    value_template: >-
      {% set e = trigger.event.data %}
      {{ e.device_id == controller_device
         and e.endpoint_id == 1
         and e.cluster_id == 64512
         and e.command in [
           'on_short_release', 'on_hold',
           'up_short_release', 'up_hold',
           'down_short_release', 'down_hold',
           'off_short_release', 'off_hold'
         ]
         and e.args.button in ['on', 'up', 'down', 'off'] }}

actions:
  - choose:
      # ============================================================
      # POWER — SHORT PRESS -> Toggle lights using Natural Light
      # ============================================================
      - conditions:
          - condition: template
            value_template: >-
              {{ trigger.event.data.command == 'on_short_release' }}
        sequence:
          - action: script.toggle_eclairage_synchronise
            data:
              area: "{{ target_area }}"

      # ============================================================
      # POWER — HOLD -> No action defined
      # ============================================================
      - conditions:
          - condition: template
            value_template: >-
              {{ trigger.event.data.command == 'on_hold' }}
        sequence: []

      # ============================================================
      # BRIGHTNESS + — SHORT PRESS -> Increase brightness by 5%
      # ============================================================
      - conditions:
          - condition: template
            value_template: >-
              {{ trigger.event.data.command == 'up_short_release' }}
        sequence:
          - action: light.turn_on
            target:
              area_id: !input area
            data:
              brightness_step_pct: 5

      # ============================================================
      # BRIGHTNESS + — HOLD -> Increase brightness by 10%
      # ============================================================
      - conditions:
          - condition: template
            value_template: >-
              {{ trigger.event.data.command == 'up_hold' }}
        sequence:
          - action: light.turn_on
            target:
              area_id: !input area
            data:
              brightness_step_pct: 10

      # ============================================================
      # BRIGHTNESS - — SHORT PRESS -> Decrease brightness by 5%
      # ============================================================
      - conditions:
          - condition: template
            value_template: >-
              {{ trigger.event.data.command == 'down_short_release' }}
        sequence:
          - action: light.turn_on
            target:
              area_id: !input area
            data:
              brightness_step_pct: -5

      # ============================================================
      # BRIGHTNESS - — HOLD -> Decrease brightness by 10%
      # ============================================================
      - conditions:
          - condition: template
            value_template: >-
              {{ trigger.event.data.command == 'down_hold' }}
        sequence:
          - action: light.turn_on
            target:
              area_id: !input area
            data:
              brightness_step_pct: -10

      # ============================================================
      # HUE / OFF — SHORT PRESS -> Toggle Natural Light
      # ============================================================
      - conditions:
          - condition: template
            value_template: >-
              {{ trigger.event.data.command == 'off_short_release' }}
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: >
                      {{ target_area in
                         states('input_text.natural_light_areas').split(';')
                         | map('trim')
                         | reject('equalto', '')
                         | list }}
                sequence:
                  - action: script.natural_light_disable_area
                    data:
                      area: "{{ target_area }}"

            default:
              - action: script.natural_light_enable_area
                data:
                  area: "{{ target_area }}"

      # ============================================================
      # HUE / OFF — HOLD -> Turn off all lights in the area
      # ============================================================
      - conditions:
          - condition: template
            value_template: >-
              {{ trigger.event.data.command == 'off_hold' }}
        sequence:
          - action: script.toggle_eclairage_synchronise
            data:
              area: "{{ target_area }}"
              state: "off"
