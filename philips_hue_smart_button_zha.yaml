blueprint:
  name: Philips Hue Smart Button ROM001 — ZHA
  description: >
    Control a Philips Hue Smart Button ROM001 connected directly to ZHA.
    Supports short press, hold (including repeated hold events), and
    long release. Listens to the Signify proprietary 0xFC00 cluster.
  domain: automation

  input:
    controller:
      name: Hue Smart Button
      description: Select the Philips Hue Smart Button ROM001.
      selector:
        device:
          filter:
            - integration: zha
              manufacturer: Signify Netherlands B.V.
              model: ROM001

    short_press:
      name: Short press action
      description: Action executed on a short press.
      default: []
      selector:
        action: {}

    hold:
      name: Hold action
      description: Action executed for every hold event while the button is held.
      default: []
      selector:
        action: {}

    long_release:
      name: Long release action
      description: Action executed when a held button is released.
      default: []
      selector:
        action: {}

mode: parallel
max: 10

trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: !input controller
      cluster_id: 64512
      command: on_press

  - platform: event
    event_type: zha_event
    event_data:
      device_id: !input controller
      cluster_id: 64512
      command: on_hold

  - platform: event
    event_type: zha_event
    event_data:
      device_id: !input controller
      cluster_id: 64512
      command: on_long_release

action:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.command == 'on_press' }}"
        sequence: !input short_press

      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.command == 'on_hold' }}"
        sequence: !input hold

      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.command == 'on_long_release' }}"
        sequence: !input long_release