alias: "Toggle éclairage synchronisé"
description: >
  Contrôle de manière synchronisée l'éclairage d'une pièce.

  À chaque appel, la pièce est inscrite dans le système Natural Light afin
  que tout nouvel allumage démarre toujours avec l'éclairage automatique.

  Natural Light peut ensuite être désactivé manuellement pour effectuer un
  réglage personnalisé pendant que les lumières sont allumées.

  Si aucun état cible n'est fourni, le script bascule l'éclairage :
  - si au moins une lumière de la pièce est allumée, toutes les lumières sont éteintes ;
  - si aucune lumière de la pièce n'est allumée, toutes les lumières sont allumées
    avec Natural Light.

  Si un état cible est fourni, le script force directement toutes les lumières
  de la pièce dans cet état.

  Le script constitue le point d'entrée pour les actions d'allumage et
  d'extinction synchronisées d'une pièce.

fields:
  area:
    name: Pièce
    description: Pièce dont l'éclairage doit être contrôlé
    required: true
    selector:
      area: null

  state:
    name: État cible
    description: >
      Si renseigné, force directement l'état de toutes les lumières.
      Sinon, bascule automatiquement entre allumé et éteint.
    required: false
    selector:
      select:
        options:
          - "on"
          - "off"

sequence:
  # Toute action d'éclairage synchronisé réactive Natural Light pour la pièce.
  - action: script.natural_light_enable_area
    data:
      area: "{{ area }}"

  - choose:
      # État explicitement demandé : ON
      - conditions:
          - condition: template
            value_template: "{{ state == 'on' }}"
        sequence:
          - action: script.natural_light
            data:
              area: "{{ area }}"
              force_all_on: true

      # État explicitement demandé : OFF
      - conditions:
          - condition: template
            value_template: "{{ state == 'off' }}"
        sequence:
          - action: light.turn_off
            target:
              area_id: "{{ area }}"

    # Aucun état demandé : véritable toggle.
    default:
      - choose:
          # Au moins une lumière est déjà allumée → tout éteindre.
          - conditions:
              - condition: template
                value_template: |
                  {{ expand(area_entities(area))
                     | selectattr('domain', 'eq', 'light')
                     | selectattr('state', 'eq', 'on')
                     | list
                     | count > 0 }}
            sequence:
              - action: light.turn_off
                target:
                  area_id: "{{ area }}"

        # Aucune lumière allumée → allumer toute la pièce avec Natural Light.
        default:
          - action: script.natural_light
            data:
              area: "{{ area }}"
              force_all_on: true

mode: single
